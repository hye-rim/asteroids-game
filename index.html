<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>아스테로이드</title>
<style>
  /* 아이폰 사파리: 버튼을 누르다 글자가 선택되거나 길게 눌러 복사 메뉴가 뜨지 않게 */
  *, *::before, *::after { -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body {
    width:100%; height:100%; overflow:hidden; background:#000;
    font-family:-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; color:#fff;
    touch-action:none;
  }
  #stage { width:100%; height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; padding:6px 8px; }
  #wrap { position:relative; background:#000; }
  #game { display:block; touch-action:none; image-rendering:pixelated; }
  #overlay { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; text-align:center; padding:14px; background:rgba(0,0,0,.82); }
  #overlay.hidden { display:none; }
  #overlay h1 { font-size:46px; font-weight:900; letter-spacing:.06em; color:#e8e8e8; text-shadow:0 3px 0 #555; }
  #overlay h2 { font-size:24px; font-weight:900; }
  #overlay p { font-size:13px; color:#e6e6e6; line-height:1.6; }
  #overlay .big { font-size:18px; font-weight:800; color:#ffd23a; }
  #overlay .help { font-size:12px; color:#bdbdbd; line-height:1.7; }
  #overlay button { margin-top:6px; background:linear-gradient(180deg,#ffffff,#9a9a9a); color:#111; font-weight:900; font-size:17px; border:none; border-radius:999px; padding:12px 34px; box-shadow:0 4px 0 #555; cursor:pointer; }
  #overlay button:active { transform:translateY(3px); box-shadow:0 1px 0 #555; }
  #top { position:absolute; right:3px; top:2px; display:flex; gap:6px; z-index:2; }
  #top button { position:relative; background:rgba(0,0,0,.55); border:1px solid rgba(255,255,255,.25); color:#fff; width:30px; height:30px; border-radius:8px; font-size:13px; cursor:pointer; }
  #top button::after { content:''; position:absolute; inset:-7px -4px; }
  /* 폰 조작판: 왼쪽 회전(◀ ▶), 오른쪽 추진·발사·순간이동 */
  #controls { display:none; width:100%; justify-content:space-between; align-items:center; padding:0 8px; }
  #turnPad { display:flex; gap:6px; touch-action:none; }
  #turnPad button { width:64px; height:72px; border-radius:18px; border:2px solid rgba(255,255,255,.25); background:rgba(255,255,255,.1); color:rgba(255,255,255,.85); font-size:26px; touch-action:none; }
  #acts { display:flex; gap:6px; align-items:center; touch-action:none; }
  #acts button { border-radius:50%; border:3px solid rgba(255,255,255,.3); color:#fff; font-weight:900; touch-action:none; }
  #thrustBtn { width:68px; height:68px; font-size:13px; background:radial-gradient(circle at 35% 30%, #8ac8ff, #1b6ac4); }
  #fireBtn { width:78px; height:78px; font-size:15px; background:radial-gradient(circle at 35% 30%, #ffb09a, #c4361b); }
  #hyperBtn { width:48px; height:48px; font-size:11px; background:radial-gradient(circle at 35% 30%, #d8b0ff, #7a2ac4); }
  #controls button.on { transform:scale(.92); filter:brightness(1.3); }
  .pc { display:none; }
  @media (pointer:fine) { .pc { display:inline; } .touch { display:none; } }
  @media (pointer:coarse) { #controls { display:flex; } }
</style>
</head>
<body>
<div id="stage">
  <div id="wrap">
    <canvas id="game"></canvas>
    <div id="top">
      <button id="muteBtn" title="소리 (M)">🔊</button>
      <button id="pauseBtn" title="일시정지 (P)">⏸</button>
    </div>
    <div id="overlay">
      <h1>아스테로이드</h1>
      <p>우주선을 돌리고 밀며 <b>소행성</b>을 쏘아 쪼개요! ☄️<br>화면 끝은 반대쪽과 이어져 있고, <b>UFO</b>도 나타나요</p>
      <div class="help">
        <span class="pc">⌨️ ← → 회전 · ↑ 추진 · 스페이스 발사 · ↓/H 순간이동<br>P 일시정지 · M 소리</span>
        <span class="touch">👆 왼쪽 ◀ ▶ 회전 · 파랑 추진 · 빨강 발사 · 보라 순간이동</span>
      </div>
      <button id="startBtn">시작하기</button>
    </div>
  </div>
  <div id="controls">
    <div id="turnPad"><button id="leftBtn">◀</button><button id="rightBtn">▶</button></div>
    <div id="acts"><button id="hyperBtn">순간<br>이동</button><button id="thrustBtn">추진</button><button id="fireBtn">발사</button></div>
  </div>
</div>
<script src="logic.js"></script>
<script src="game.js"></script>
</body>
</html>
